    <style>
        /* ... ВАШ CSS БЕЗ ИЗМЕНЕНИЙ ... */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }

        .header { background-color: #edece7; padding: 15px 20px; text-align: center; border-radius: 12px 12px 0 0; margin: 0 -20px 20px -20px; }
        .header h1 { margin: 0; font-size: 28px; font-weight: 800; color: #1a1a1a; letter-spacing: 2px; }
        
        /* НОВОЕ: Контейнер для таблицы и спиннера */
        .table-container { position: relative; min-height: 200px; }
        
        /* НОВОЕ: Стили спиннера */
        .spinner-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: none; /* Скрыт по умолчанию */
            justify-content: center; align-items: center;
            z-index: 10;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3; border-top: 4px solid #002408;
            border-radius: 50%;
            animation: spin 1s linear infinite;

<body>

<div class="container">
    <!-- НОВОЕ: Кнопка установки PWA -->
    <button id="installAppBtn" class="btn-install">📲 Установить приложение</button>

    <div class="controls">
        <!-- НОВОЕ: aria-label для доступности -->
        <select id="monthSelect" aria-label="Выберите месяц для просмотра расписания"></select>
        <div class="title-header">Ламаза ха</div>
        <button class="btn-download" onclick="downloadImage()" aria-label="Скачать расписание на выбранный месяц в виде картинки">Скачать картинку</button>
    </div>

    <div class="header">
        <h1 id="monthTitle">Загрузка...</h1>
    </div>

    <!-- НОВОЕ: Обертка для таблицы и спиннера -->
    <div class="table-container">
        <div id="loadingSpinner" class="spinner-overlay">
            <div class="spinner"></div>
        </div>
        <div class="table-wrap">
            <table id="prayerTable">
                <thead>
                    <tr>
                        <th>Денош</th>
                        <th>Сатассар</th>
                        <th>Малхкхетар</th>
                        <th>Делкъа</th>
                        <th>Малхбуза</th>
                        <th>Маьрк1ижа</th>
                        <th>Пхьера</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // =========================================================
    // 1. РЕГИСТРАЦИЯ SERVICE WORKER (Для оффлайн работы)
    // =========================================================
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker зарегистрирован!', reg))
                .catch(err => console.error('Ошибка регистрации Service Worker:', err));
        });
    }

    // =========================================================
    // 2. ЛОГИКА УСТАНОВКИ ПРИЛОЖЕНИЯ (PWA)
    // =========================================================
    let deferredPrompt;
    const installBtn = document.getElementById('installAppBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        // Предотвращаем стандартное всплывающее окно браузера
        e.preventDefault();
        // Сохраняем событие для вызова по кнопке
        deferredPrompt = e;
        // Показываем нашу кнопку
        installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`Пользователь ответил: ${outcome}`);
            deferredPrompt = null;
            installBtn.style.display = 'none';
        }
    });

    // Скрываем кнопку, если приложение уже установлено
    window.addEventListener('appinstalled', () => {
        installBtn.style.display = 'none';
    });


    // =========================================================
    // 3. ЗАГРУЗКА ДАННЫХ И ТАБЛИЦЫ (с добавленным спиннером)
    // =========================================================
    const monthList = [
        { ru: "Январь", en: "January" }, { ru: "Февраль", en: "February" },
        { ru: "Март", en: "March" }, { ru: "Апрель", en: "April" },
        { ru: "Май", en: "May" }, { ru: "Июнь", en: "June" },
        { ru: "Июль", en: "July" }, { ru: "Август", en: "August" },
        { ru: "Сентябрь", en: "September" }, { ru: "Октябрь", en: "October" },
        { ru: "Ноябрь", en: "November" }, { ru: "Декабрь", en: "December" }
    ];

    const currentDate = new Date();
    const currentYear = currentDate.getFullYear();
    let currentMonthIndex = currentDate.getMonth(); 
    let currentMonthData = monthList[currentMonthIndex]; 

    const monthSelect = document.getElementById('monthSelect');
    const tableBody = document.getElementById('tableBody');
    const headerTitle = document.getElementById('monthTitle');
    const loadingSpinner = document.getElementById('loadingSpinner'); // НОВОЕ

    monthList.forEach((month, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = month.ru;
        if (index === currentMonthIndex) option.selected = true;
        monthSelect.appendChild(option);
    });

    async function loadMonth(monthData) {
        // Показываем спиннер перед загрузкой
        loadingSpinner.style.display = 'flex'; 
        
        try {
            const response = await fetch(`json/${monthData.en}.json`);
            if (!response.ok) throw new Error('Файл не найден');
            const days = await response.json();
            
            renderTable(monthData, days);
        } catch (error) {
            console.error('Ошибка загрузки данных:', error);
            tableBody.innerHTML = `<tr><td colspan="7" style="color:red;">Ошибка! Проверьте файл: json/${monthData.en}.json</td></tr>`;
        } finally {
            // Скрываем спиннер в любом случае (успех или ошибка)
            loadingSpinner.style.display = 'none';
        }
    }

    function renderTable(monthData, days) {
        const today = currentDate.getDate();
        const isCurrentMonth = monthList[currentMonthIndex].en === monthData.en;
        currentMonthData = monthData; 
        
        let html = '';
        days.forEach(row => {
            const isToday = (isCurrentMonth && row.day === today) ? 'today' : '';
            html += `
                <tr class="${isToday}">
                    <td>${row.day}</td>
                    <td>${row.fajr}</td>
                    <td>${row.sunrise}</td>
                    <td>${row.zuhr}</td>
                    <td>${row.asr}</td>
                    <td>${row.maghrib}</td>
                    <td>${row.isha}</td>
                </tr>
            `;
        });
        tableBody.innerHTML = html;
        headerTitle.textContent = `${monthData.ru} ${currentYear}`;
    }

    monthSelect.addEventListener('change', (e) => {
        const selectedIndex = e.target.value;
        const selectedMonthData = monthList[selectedIndex];
        loadMonth(selectedMonthData);
    });

    loadMonth(currentMonthData);

    function downloadImage() {
        if (!currentMonthData) return alert("Данные еще загружаются.");
        const link = document.createElement('a');
        link.download = `Ламаза_ха_${currentMonthData.ru}.png`;
        link.href = `img/${currentMonthData.en}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
