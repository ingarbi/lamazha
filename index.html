<body>

<div class="container">
    <div class="controls">
        <select id="monthSelect"></select>
        <div class="title-header">Ламаза ха</div>
        <button class="btn-download" onclick="downloadImage()">Скачать картинку</button>
    </div>

    <div class="header">
        <h1 id="monthTitle">Загрузка...</h1>
    </div>

    <div class="table-wrap">
        <table id="prayerTable">
            <thead>
                <tr>
                    <th>Денош</th>
                    <th>Сатассар</th>
                    <th>Малхкхетар</th>
                    <th>Делкъа ха</th>
                    <th>Малхбуза ха</th>
                    <th>Маьрк1ижа ха</th>
                    <th>Пхьера ха</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // =========================================================
    // СПИСОК МЕСЯЦЕВ (Русский для отображения, Английский для файлов)
    // =========================================================
    const monthList = [
        { ru: "Январь", en: "January" },
        { ru: "Февраль", en: "February" },
        { ru: "Март", en: "March" },
        { ru: "Апрель", en: "April" },
        { ru: "Май", en: "May" },
        { ru: "Июнь", en: "June" },
        { ru: "Июль", en: "July" },
        { ru: "Август", en: "August" },
        { ru: "Сентябрь", en: "September" },
        { ru: "Октябрь", en: "October" },
        { ru: "Ноябрь", en: "November" },
        { ru: "Декабрь", en: "December" }
    ];

    // Получаем текущую дату
    const currentDate = new Date();
    const currentYear = currentDate.getFullYear();
    let currentMonthIndex = currentDate.getMonth(); // 0-11
    let currentMonthData = monthList[currentMonthIndex]; // Данные текущего месяца

    const monthSelect = document.getElementById('monthSelect');
    const tableBody = document.getElementById('tableBody');
    const headerTitle = document.getElementById('monthTitle');

    // Заполняем выпадающий список (для пользователя - русские названия)
    monthList.forEach((month, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = month.ru;
        if (index === currentMonthIndex) option.selected = true;
        monthSelect.appendChild(option);
    });

    // Асинхронная загрузка JSON из папки
    async function loadMonth(monthData) {
        try {
            // Загружаем файл по английскому названию (например, json/January.json)
            const response = await fetch(`json/${monthData.en}.json`);
            if (!response.ok) throw new Error('Файл не найден');
            const days = await response.json();
            
            renderTable(monthData, days);
        } catch (error) {
            console.error('Ошибка загрузки данных:', error);
            tableBody.innerHTML = `<tr><td colspan="7" style="color:red;">Ошибка! Проверьте, переименован ли файл: <br> json/${monthData.en}.json</td></tr>`;
        }
    }

    function renderTable(monthData, days) {
        const today = currentDate.getDate();
        const isCurrentMonth = monthList[currentMonthIndex].en === monthData.en;
        currentMonthData = monthData; // Запоминаем для скачивания
        
        let html = '';
        days.forEach(row => {
            const isToday = (isCurrentMonth && row.day === today) ? 'today' : '';
            html += `
                <tr class="${isToday}">
                    <td>${row.day}</td>
                    <td>${row.fajr}</td>
                    <td>${row.sunrise}</td>
                    <td>${row.zuhr}</td>
                    <td>${row.asr}</td>
                    <td>${row.maghrib}</td>
                    <td>${row.isha}</td>
                </tr>
            `;
        });
        tableBody.innerHTML = html;
        // В заголовке пишем по-русски для красоты
        headerTitle.textContent = `${monthData.ru} ${currentYear}`;
    }

    // Смена месяца в селекторе
    monthSelect.addEventListener('change', (e) => {
        const selectedIndex = e.target.value;
        const selectedMonthData = monthList[selectedIndex];
        loadMonth(selectedMonthData);
    });

    // Инициализация текущим месяцем
    loadMonth(currentMonthData);

    // =========================================================
    // СКАЧИВАНИЕ ГОТОВОЙ КАРТИНКИ ИЗ ПАПКИ IMG
    // =========================================================
    function downloadImage() {
        if (!currentMonthData) {
            alert("Данные еще загружаются, подождите немного.");
            return;
        }
        
        const link = document.createElement('a');
        // Сохраняем файл с русским названием
        link.download = `Ламаза_ха_${currentMonthData.ru}.png`;
        // Берем картинку по английскому названию (например, img/January.png)
        link.href = `img/${currentMonthData.en}.png`;
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
